<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #5b86e5, #36d1dc);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logout-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #ffffffdd;
      padding: 8px 18px;
      border-radius: 30px;
      text-decoration: none;
      color: #444;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #fff;
      transition: 0.3s;
    }

    .logout-btn:hover {
      background: #e8e8e8;
    }

    .dashboard-box {
      background: rgba(255, 255, 255, 0.9);
      width: 400px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.25);
      text-align: center;
    }

    h2 {
      color: #222;
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      color: #444;
      margin: 8px 0;
    }

    .highlight {
      font-weight: bold;
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>

  <div class="dashboard-box">
    <h2>Welcome, <span class="highlight">{{ user.name }}</span> 👋</h2>
    <p>Email: <span class="highlight">{{ user.email }}</span></p>
    <p>Account Created: <span class="highlight">{{ user.created_at }}</span></p>
  </div>

</body>
</html>
